<style>
/* Same look as the Worker's password screen (worker/gate.mjs). */
*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
html{background:#14171a;color-scheme:dark}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:#14171a;color:#e6eae7;line-height:1.5;
  font-family:-apple-system,'SF Pro Text','Segoe UI',Inter,Roboto,'Helvetica Neue',sans-serif;
  padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
main{width:100%;max-width:340px;text-align:center}
img{display:block;margin:0 auto 18px;border-radius:16px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sub{color:#8b979e;font-size:15px;margin:4px 0 26px}
form{text-align:left}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8b979e;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;margin-bottom:8px}
input{width:100%;font:inherit;font-size:17px;color:#e6eae7;background:#1b2025;
  border:1px solid #2c343b;border-radius:10px;padding:13px 14px;outline:none}
input:focus{border-color:#5C8A74;box-shadow:0 0 0 3px rgba(92,138,116,.25)}
button{width:100%;margin-top:14px;font:inherit;font-size:17px;font-weight:700;color:#0f1316;
  background:#5C8A74;border:none;border-radius:10px;padding:13px;cursor:pointer}
button:active{background:#7fb094}
button:disabled{opacity:.7;cursor:progress}
.err{color:#e0907c;font-size:14px;margin-top:10px}
.hint{color:#5c676e;font-size:13px;margin-top:22px}
</style>

<main id="gate" hidden>
<img src="icon.svg" alt="" width="72" height="72">
<h1>The Widow's Dower</h1>
<p class="sub">A private history of the Myers family.</p>
<form id="f">
  <label for="pw">Family password</label>
  <input id="pw" name="password" type="password" required autofocus
         autocomplete="current-password" autocapitalize="none" autocorrect="off"
         spellcheck="false" enterkeyhint="go">
  <p class="err" id="err" role="alert" hidden></p>
  <button id="go" type="submit">Open</button>
</form>
<p class="hint">Capitals and spaces don't matter. Don't have it? Ask whoever sent you the link.</p>
</main>

<script>
(function () {
  "use strict";
  /* Offline support: install the service worker before anything else, so
     even the password screen opens with no signal. */
  try { if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {}); }
  catch (e) { /* no service workers here */ }

  var S = JSON.parse(document.getElementById("sealed").textContent);
  var KEY = "wd-key-" + S.salt.slice(0, 16);   // a new password means a new salt: old keys stop matching
  var gate = document.getElementById("gate"), form = document.getElementById("f"),
      input = document.getElementById("pw"), err = document.getElementById("err"),
      btn = document.getElementById("go");
  var enc = new TextEncoder();
  var unb64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64 = function (u) { var s = ""; u.forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s); };
  var norm = function (p) { return String(p || "").trim().replace(/\s+/g, " ").toLowerCase(); };
  var say = function (msg) { err.textContent = msg; err.hidden = !msg; gate.hidden = false; };

  if (!window.crypto || !crypto.subtle) {
    say("This page has to be opened over a secure connection. Check the address starts with https://");
    form.hidden = true;
    return;
  }

  function open(key) {
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(S.iv) }, key, unb64(S.ct))
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  /* Swap in the app only once this page has fully loaded. On a return
     visit the remembered key decrypts before the browser has finished
     reading this page; replacing it then appends the app to this page
     instead, and these styles squash its layout. */
  function show(html) {
    var swap = function () { document.open(); document.write(html); document.close(); };
    if (document.readyState === "complete") swap();
    else window.addEventListener("load", swap);
  }
  function remember(key) {
    return crypto.subtle.exportKey("raw", key).then(function (raw) {
      try {
        Object.keys(localStorage).forEach(function (k) { if (k.indexOf("wd-key-") === 0) localStorage.removeItem(k); });
        localStorage.setItem(KEY, b64(new Uint8Array(raw)));
      } catch (e) { /* private browsing: it will ask again next time */ }
    });
  }
  function derive(pw) {
    return crypto.subtle.importKey("raw", enc.encode(norm(pw)), "PBKDF2", false, ["deriveKey"])
      .then(function (base) {
        return crypto.subtle.deriveKey(
          { name: "PBKDF2", hash: "SHA-256", salt: unb64(S.salt), iterations: S.iter },
          base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
      });
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    btn.disabled = true; btn.textContent = "Opening…"; say("");
    var key;
    derive(input.value)
      .then(function (k) { key = k; return open(k); })
      .then(function (html) { return remember(key).then(function () { show(html); }); })
      .catch(function () {
        btn.disabled = false; btn.textContent = "Open";
        say("That isn't the family password.");
        input.select();
      });
  });

  /* Opened on this phone before? Use the remembered key and skip the screen. */
  var saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) { /* storage blocked */ }
  if (!saved) { gate.hidden = false; return; }
  crypto.subtle.importKey("raw", unb64(saved), "AES-GCM", true, ["decrypt"])
    .then(open).then(show)
    .catch(function () {
      try { localStorage.removeItem(KEY); } catch (e) {}
      gate.hidden = false;
    });
})();
</script>
